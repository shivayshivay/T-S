name: PhotoMorph CaseVault CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check ZIP exists
        run: test -f PhotoMorph-CaseVault-V1.zip

      - name: Extract project
        run: |
          unzip -q PhotoMorph-CaseVault-V1.zip -d extracted
          ls -la extracted/PhotoMorph-CaseVault-V1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r extracted/PhotoMorph-CaseVault-V1/requirements-dev.txt

      - name: Check Python syntax
        run: |
          python -m py_compile extracted/PhotoMorph-CaseVault-V1/app/main.py
          python -m py_compile extracted/PhotoMorph-CaseVault-V1/tests/test_api.py

      - name: Run automated tests
        working-directory: extracted/PhotoMorph-CaseVault-V1
        run: python -m pytest -v

      - name: Build Docker image
        run: |
          docker build \
            -t photomorph-casevault:latest \
            extracted/PhotoMorph-CaseVault-V1
